<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>abomb.com</title>
<meta name="description" content="abomb.com — coming soon.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --ink: #e2f34b;
    --shadow: #858f2c;
    --bg: #000;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 3vh, 28px);
    padding: 16px;
  }

  /* The stage is a real button so it works by mouse, touch and keyboard. */
  .stage {
    all: unset;
    display: block;
    cursor: pointer;
    width: min(88vw, 62vh * 181 / 153, 640px);
    aspect-ratio: 181 / 153;
    border-radius: 6px;
  }
  .stage:focus-visible { outline: 2px dashed var(--ink); outline-offset: 10px; }
  .stage svg { display: block; width: 100%; height: 100%; overflow: visible; }

  /* ---- calm state (also the "return" transitions) ---- */
  .rise, .billow, .glow { transform-box: view-box; }
  .rise {
    transform-origin: 90px 95.5px;
    transform: scale(0.12, 0);
    transition: transform 1.1s cubic-bezier(.55, 0, .75, .4);
  }
  .billow { transform-origin: 90px 60px; }
  /* The shadows' growth is driven by the script below; CSS only fades them. */
  .shadows {
    opacity: 0;
    transition: opacity .9s ease-in;
  }
  .glow { opacity: 0; transition: opacity .8s ease-in; }
  .family {
    fill: var(--ink);
    stroke: var(--ink);
    stroke-width: 1.3;
    stroke-opacity: 0;
    paint-order: stroke fill;
    stroke-linejoin: round;
    transition: fill .6s .4s ease, stroke-opacity .6s .4s ease;
  }
  .tagline {
    margin: 0;
    font-size: clamp(14px, 2.4vw, 20px);
    font-weight: normal;
    letter-spacing: .5em;
    text-transform: uppercase;
    padding-left: .5em; /* balance the trailing letter-spacing */
    opacity: .35;
  }

  /* ---- detonated ---- */
  .boom .rise {
    transform: none;
    transition: transform 1.25s .06s cubic-bezier(.16, 1.25, .3, 1);
  }
  .boom .billow { animation: billow 5s 1.3s ease-in-out infinite alternate; }
  .boom .shadows {
    opacity: 1;
    transition: opacity .15s .05s;
  }
  .boom .glow { opacity: 1; transition: opacity .25s; }
  .boom .family {
    fill: #000;
    stroke-opacity: 1;
    transition: fill .12s ease, stroke-opacity .12s ease;
  }
  .boom.fresh .stage { animation: shake .45s .04s linear; }
  .boom.fresh .flash { animation: flash .7s ease-out; }

  .flash {
    position: fixed;
    inset: 0;
    background: #fffde8;
    opacity: 0;
    pointer-events: none;
  }

  @keyframes flash {
    0% { opacity: 0; }
    8% { opacity: .92; }
    100% { opacity: 0; }
  }
  @keyframes shake {
    0%, 100% { transform: none; }
    15% { transform: translate(-3px, 2px); }
    30% { transform: translate(3px, -2px); }
    45% { transform: translate(-2px, -1px); }
    60% { transform: translate(2px, 1px); }
    80% { transform: translate(-1px, 0); }
  }
  @keyframes billow {
    from { transform: scale(1, 1); }
    to { transform: scale(1.025, 1.035); }
  }

  /* Reduced motion: a plain crossfade, no flash, shake or growth. */
  @media (prefers-reduced-motion: reduce) {
    .rise, .boom .rise { transform: none; }
    .rise { opacity: 0; transition: opacity .4s; }
    .boom .rise { opacity: 1; transition: opacity .4s; }
    .shadows, .boom .shadows { transition: opacity .4s; }
    .boom .billow, .boom.fresh .stage, .boom.fresh .flash { animation: none; }
  }
</style>
</head>

<script>
  const root = document.getElementById("root");
  const stage = root.querySelector(".stage");
  let lastPointer = "";
  let freshTimer;

  // The shadows grow out from the feet, as if the blast's light were dropping
  // from overhead: every point slides along its own ray from the blast's
  // ground point, so the feet stay put and the head end reaches down and out.
  // A point whose full shadow is stretched k times from the feet line sits,
  // at growth g, where a stretch of 1 / (1 - g * (1 - 1/k)) puts it.
  // Everything is derived from the shadow path itself, so hand edits to it
  // animate the same way.
  const shadow = (() => {
    const AX = 90, HORIZON = 95.5;   // the blast's ground point, on the cloud's axis
    const PARAMS = { M: 2, L: 2, C: 6, S: 4, Q: 4, T: 2, A: 7, Z: 0 };
    const path = root.querySelector(".shadows path");
    const tokens = path.getAttribute("d").match(/[MLCSQTAZ]|-?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/gi);
    const parts = [], pts = [];
    for (let i = 0, cmd = ""; i < tokens.length;) {
      if (/^[MLCSQTAZ]$/i.test(tokens[i])) { cmd = tokens[i++].toUpperCase(); parts.push(cmd); continue; }
      const args = tokens.slice(i, i += PARAMS[cmd]).map(Number);
      if (cmd === "A") parts.push(args.splice(0, 5).join(" ") + " ");
      for (let j = 0; j < args.length; j += 2) { parts.push(pts.length); pts.push(args.slice(j, j + 2)); }
    }
    const feet = Math.min(...pts.map(p => p[1]));
    const rays = pts.map(([x, y]) => {
      const k = Math.max((y - HORIZON) / (feet - HORIZON), 1);
      return { k, bx: AX + (x - AX) / k };
    });
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    let g = 0, raf = 0;

    function draw(growth) {
      g = growth;
      path.setAttribute("d", parts.map(p => {
        if (typeof p !== "number") return p;
        const { k, bx } = rays[p];
        const s = 1 / (1 - growth * (1 - 1 / k));
        return `${(AX + (bx - AX) * s).toFixed(2)},${(HORIZON + (feet - HORIZON) * s).toFixed(2)} `;
      }).join(""));
    }

    function go(on) {
      cancelAnimationFrame(raf);
      if (reduce.matches) return draw(1);   // no growth; CSS just crossfades
      const from = g, to = on ? 1 : 0;
      const delay = on ? 50 : 0, duration = on ? 550 : 900;
      const ease = on ? t => 1 - (1 - t) ** 4 : t => t * t;
      const start = performance.now();
      const frame = now => {
        const t = Math.min(Math.max((now - start - delay) / duration, 0), 1);
        draw(from + (to - from) * ease(t));
        if (t < 1) raf = requestAnimationFrame(frame);
      };
      raf = requestAnimationFrame(frame);
    }

    draw(reduce.matches ? 1 : 0);
    return { go };
  })();

  function set(on) {
    if (root.classList.contains("boom") === on) return;
    root.classList.toggle("boom", on);
    stage.setAttribute("aria-pressed", String(on));
    shadow.go(on);
    // Flash and shake only on the way in, and only once per detonation.
    root.classList.toggle("fresh", on);
    clearTimeout(freshTimer);
    if (on) freshTimer = setTimeout(() => root.classList.remove("fresh"), 800);
  }

  // Mouse: hover detonates, leaving rewinds it (like the original rollover).
  stage.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") set(true); });
  stage.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") set(false); });
  // Touch, pen and keyboard: press toggles.
  stage.addEventListener("pointerdown", e => { lastPointer = e.pointerType; });
  stage.addEventListener("click", () => {
    if (lastPointer !== "mouse") set(!root.classList.contains("boom"));
    lastPointer = "";
  });
