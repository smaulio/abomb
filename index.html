<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>abomb.com</title>
<meta name="description" content="abomb.com — coming soon.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --ink: #e2f34b;
    --shadow: #858f2c;
    --bg: #000;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 3vh, 28px);
    padding: 16px;
  }

  /* The stage is a real button so it works by mouse, touch and keyboard. */
  .stage {
    all: unset;
    display: block;
    cursor: pointer;
    width: min(88vw, 62vh * 181 / 153, 640px);
    aspect-ratio: 181 / 153;
    border-radius: 6px;
  }
  .stage:focus-visible { outline: 2px dashed var(--ink); outline-offset: 10px; }
  .stage svg { display: block; width: 100%; height: 100%; overflow: visible; }

  /* ---- calm state (also the "return" transitions) ---- */
  .rise, .billow, .shadows, .glow { transform-box: view-box; }
  .rise {
    transform-origin: 90px 95.5px;
    transform: scale(0.12, 0);
    transition: transform 1.1s cubic-bezier(.55, 0, .75, .4);
  }
  .billow { transform-origin: 90px 60px; }
  .shadows {
    transform-origin: 90.5px 110px;
    transform: scale(0.6, 0);
    opacity: 0;
    transition: transform .9s ease-in, opacity .9s ease-in;
  }
  .glow { opacity: 0; transition: opacity .8s ease-in; }
  .family {
    fill: var(--ink);
    stroke: var(--ink);
    stroke-width: 1.3;
    stroke-opacity: 0;
    paint-order: stroke fill;
    stroke-linejoin: round;
    transition: fill .6s .4s ease, stroke-opacity .6s .4s ease;
  }
  .tagline {
    margin: 0;
    font-size: clamp(14px, 2.4vw, 20px);
    font-weight: normal;
    letter-spacing: .5em;
    text-transform: uppercase;
    padding-left: .5em; /* balance the trailing letter-spacing */
    opacity: .35;
    transition: opacity .6s ease, letter-spacing .6s ease;
  }

  /* ---- detonated ---- */
  .boom .rise {
    transform: none;
    transition: transform 1.25s .06s cubic-bezier(.16, 1.25, .3, 1);
  }
  .boom .billow { animation: billow 5s 1.3s ease-in-out infinite alternate; }
  .boom .shadows {
    transform: none;
    opacity: 1;
    transition: transform .55s .05s cubic-bezier(.2, .9, .3, 1), opacity .15s .05s;
  }
  .boom .glow { opacity: 1; transition: opacity .25s; }
  .boom .family {
    fill: #000;
    stroke-opacity: 1;
    transition: fill .12s ease, stroke-opacity .12s ease;
  }
  .boom .tagline {
    opacity: 1;
    letter-spacing: .7em;
    transition: opacity .8s .9s ease, letter-spacing 1.4s .9s cubic-bezier(.2, .8, .3, 1);
  }
  .boom.fresh .stage { animation: shake .45s .04s linear; }
  .boom.fresh .flash { animation: flash .7s ease-out; }

  .flash {
    position: fixed;
    inset: 0;
    background: #fffde8;
    opacity: 0;
    pointer-events: none;
  }

  @keyframes flash {
    0% { opacity: 0; }
    8% { opacity: .92; }
    100% { opacity: 0; }
  }
  @keyframes shake {
    0%, 100% { transform: none; }
    15% { transform: translate(-3px, 2px); }
    30% { transform: translate(3px, -2px); }
    45% { transform: translate(-2px, -1px); }
    60% { transform: translate(2px, 1px); }
    80% { transform: translate(-1px, 0); }
  }
  @keyframes billow {
    from { transform: scale(1, 1); }
    to { transform: scale(1.025, 1.035); }
  }

  /* Reduced motion: a plain crossfade, no flash, shake or growth. */
  @media (prefers-reduced-motion: reduce) {
    .rise, .boom .rise, .shadows, .boom .shadows { transform: none; }
    .rise { opacity: 0; transition: opacity .4s; }
    .boom .rise { opacity: 1; transition: opacity .4s; }
    .shadows, .boom .shadows { transition: opacity .4s; }
    .boom .billow, .boom.fresh .stage, .boom.fresh .flash { animation: none; }
    .tagline, .boom .tagline { letter-spacing: .5em; transition: opacity .4s; }
  }
</style>
</head>

<script>
  const root = document.getElementById("root");
  const stage = root.querySelector(".stage");
  let lastPointer = "";
  let freshTimer;

  function set(on) {
    if (root.classList.contains("boom") === on) return;
    root.classList.toggle("boom", on);
    stage.setAttribute("aria-pressed", String(on));
    // Flash and shake only on the way in, and only once per detonation.
    root.classList.toggle("fresh", on);
    clearTimeout(freshTimer);
    if (on) freshTimer = setTimeout(() => root.classList.remove("fresh"), 800);
  }

  // Mouse: hover detonates, leaving rewinds it (like the original rollover).
  stage.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") set(true); });
  stage.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") set(false); });
  // Touch, pen and keyboard: press toggles.
  stage.addEventListener("pointerdown", e => { lastPointer = e.pointerType; });
  stage.addEventListener("click", () => {
    if (lastPointer !== "mouse") set(!root.classList.contains("boom"));
    lastPointer = "";
  });
</script>
